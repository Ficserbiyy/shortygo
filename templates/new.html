<!DOCTYPE html>
<html>
<head>
    <title>Short Link Creation</title>
</head>
<body>
    <h1>New short URL</h1>

    <form action="/shorten" method="POST">
        <div>
            <label>Original URL: </label>
            <input type="text" name="title" placeholder="https://www.google.com/" required>
        </div>

    <hr>
        <button type="submit">Publish</button>
    </form>


</body>
</html>
